services:
  runbook:
    container_name: runbook
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Non-secret config here. Secrets (SEED_ADMIN_*) are injected by `bws run`
    # and must be referenced below so Compose passes them into the container.
    # APP_PORT defaults to 8081, override by exporting APP_PORT (e.g. in token.env).
    environment:
      ADDR: 0.0.0.0
      APP_PORT: ${APP_PORT:-8081}
      DB_PATH: /data/runbook.db
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - runbook-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
    networks:
      - archnet

volumes:
  runbook-data:

networks:
  # archnet is external; on local machines, run `docker network create archnet` once.
  archnet:
    external: true
