services:
  runbook:
    container_name: runbook
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Secrets are injected via `bws run`; non-secret config here.
    # APP_PORT defaults to 8081, override by exporting APP_PORT (e.g. in token.env).
    environment:
      ADDR: 0.0.0.0
      APP_PORT: ${APP_PORT:-8081}
      DB_PATH: /data/runbook.db
    volumes:
      - runbook-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
    networks:
      - archnet

volumes:
  runbook-data:

networks:
  # archnet is external; on local machines, run `docker network create archnet` once.
  archnet:
    external: true
